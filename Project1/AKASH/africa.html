<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Travel Guide</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
}

/* HERO SECTION */
.hero{
    background:url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5');
    height:65vh;
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hero h1{
    color:white;
    background:rgba(0,0,0,0.6);
    padding:20px 35px;
    border-radius:10px;
    font-size:55px;
}

/* CONTENT */
.container{
    width:90%;
    margin:auto;
    padding:50px 0;
}

.container p{
    text-align:center;
    font-size:18px;
    line-height:1.8;
    color:#444;
    margin-bottom:40px;
}

/* GALLERY */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h2{
    padding:15px;
    text-align:center;
    color:#333;
}

/* BUTTON */
.center{
    text-align:center;
}

.btn{
    display:inline-block;
    margin-top:40px;
    text-decoration:none;
    background:#222;
    color:white;
    padding:12px 25px;
    border-radius:6px;
    transition:0.3s;
}

.btn:hover{
    background:#ff9800;
}

/* FOOTER */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>Africa Travel Guide</h1>
</div>

<!-- CONTENT -->
<div class="container">

    <p>
        Africa is famous for wildlife safaris, deserts,
        waterfalls, forests, beaches, and rich cultural heritage.
    </p>

    <!-- IMAGE GALLERY -->
    <div class="gallery">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1547471080-7cc2caa01a7e" alt="">
            <h2>Safari Wildlife</h2>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1516426122078-c23e76319801" alt="">
            <h2>African Desert</h2>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1508672019048-805c876b67e2" alt="">
            <h2>Mountain Landscape</h2>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1523805009345-7448845a9e53" alt="">
            <h2>Beautiful Waterfall</h2>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5" alt="">
            <h2>Nature Safari</h2>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1509099836639-18ba1795216d" alt="">
            <h2>African Beach</h2>
        </div>

    </div>

    <!-- BUTTON -->
    <div class="center">
        <a href="Destinations.html" class="btn">Back to Home</a>
    </div>

</div>

<!-- FOOTER -->
<footer>
    <p>© 2026 Africa Travel Guide</p>
</footer>

</body>
</html>
