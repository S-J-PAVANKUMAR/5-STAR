<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travelling Resources</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      color:#333;
    }

    .back-btn{
      display:inline-block;
      margin:20px;
      padding:10px 18px;
      background:#0077b6;
      color:white;
      text-decoration:none;
      border-radius:6px;
    }

    .back-btn:hover{
      background:#023e8a;
    }

    nav{
      background:#023e8a;
      padding:15px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
    }

    .logo{
      color:white;
      font-size:28px;
      font-weight:bold;
    }

    nav ul{
      list-style:none;
      display:flex;
      flex-wrap:wrap;
    }

    nav ul li{
      margin-left:15px;
    }

    nav ul li a{
      color:white;
      text-decoration:none;
      padding:8px 14px;
      border-radius:5px;
      transition:0.3s;
    }

    nav ul li a:hover{
      background:#0077b6;
    }

  </style>
